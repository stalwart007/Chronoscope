# Serves the SPA and reverse-proxies the API on one origin, so the browser
# never deals with CORS and cookies/streams behave identically to production.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream chronoscope_api {
  server api:8000;
  keepalive 32;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 8g;          # long-form video uploads
  client_body_timeout 900s;
  sendfile on;
  tcp_nopush on;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The API sets the full security-header set (CSP, frame options, referrer
  # policy) on its own responses. Repeating them here would emit duplicate,
  # conflicting headers on proxied routes, browsers then apply the most
  # restrictive value, which silently breaks whichever policy is stricter. So
  # nginx sets them only for the static SPA responses it serves itself.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  }

  # Hashed build assets are immutable; index.html must never be cached or the
  # app pins itself to a stale bundle after a deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location /api/ {
    proxy_pass http://chronoscope_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Server-sent events: no buffering, no chunk coalescing, long read window.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;
  }

  location ~ ^/(frames|artifacts)/ {
    proxy_pass http://chronoscope_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
