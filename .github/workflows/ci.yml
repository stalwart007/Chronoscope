name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # The project declares dependencies in pyproject.toml and ships no
          # lockfile, so key the cache on that instead of the default uv.lock.
          cache-dependency-glob: backend/pyproject.toml
      - name: Install
        run: |
          uv venv --python 3.12 backend/.venv
          uv pip install --python backend/.venv/bin/python -e "backend[dev]"
      - name: Lint
        run: backend/.venv/bin/python -m ruff check backend/app backend/tests
      - name: Types
        # Run from backend/ so mypy picks up its config in pyproject.toml.
        working-directory: backend
        run: .venv/bin/python -m mypy app
      - name: Test
        working-directory: backend
        run: .venv/bin/python -m pytest -q --timeout=180

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci || npm install
      - working-directory: frontend
        run: npx tsc --noEmit
      - working-directory: frontend
        run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
